<!-- 先套用深淺色設定，避免開頁時閃一下 -->
<script>
  (function () {
    try {
      var t = localStorage.getItem('tcm-theme');
      if (!t) { // 相容舊版設定
        var old = localStorage.getItem('tcm-dark');
        if (old === '1') t = 'dark';
      }
      if (t === 'dark' || t === 'light') document.documentElement.dataset.theme = t;
    } catch (e) {}
  })();
</script>
