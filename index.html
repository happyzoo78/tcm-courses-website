<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>中醫學堂｜課程圖卡總目錄</title>

<!-- 標題用的襯線字體（只載入粗體，內文用系統字體，讀起來更清晰、載入更快） -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@700;900&display=swap" rel="stylesheet">

<!-- 先套用深淺色設定，避免開頁時閃一下 -->
<script>
  (function () {
    try {
      var t = localStorage.getItem('tcm-theme');
      if (!t) { // 相容舊版設定
        var old = localStorage.getItem('tcm-dark');
        if (old === '1') t = 'dark';
      }
      if (t === 'dark' || t === 'light') document.documentElement.dataset.theme = t;
    } catch (e) {}
  })();
</script>

<style>
/* =========================================================
   一、配色（護眼：暖米色紙張感，避免純白與純黑）
   想改顏色，只要改這一區的數值即可
   ========================================================= */
:root {
  --bg:            #f3ede1;  /* 頁面底色 */
  --surface:       #fbf7ef;  /* 卡片底色 */
  --surface-2:     #efe6d4;  /* 次要區塊 */
  --ink:           #2b2f2a;  /* 主要文字 */
  --muted:         #5f5a4c;  /* 次要文字 */
  --line:          #ddd0b8;  /* 分隔線 */
  --accent:        #3d5e50;  /* 主色：松綠 */
  --accent-ink:    #fbf7ef;  /* 主色上的文字 */
  --accent-soft:   #e1eadf;  /* 淡主色（標籤） */
  --accent-soft-ink:#2f4a3f;
  --red:           #973d2f;  /* 強調色：朱紅 */
  --gold:          #8a6f46;
  --cover-from:    #dde3d2;  /* 科目封面漸層 */
  --cover-to:      #ecdcc0;
  --cover-ink:     #3f5546;
  --cover-chip:    #f8f2e6d9;
  --shadow:        0 4px 18px #3d30201a;
  --focus:         #c07a2c;
}

/* 深色模式的顏色（暖灰綠，不用純黑，夜間較不刺眼） */
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg:#1b1f1d; --surface:#232926; --surface-2:#2b322e;
    --ink:#e6e0d2; --muted:#b4ab98; --line:#3c4540;
    --accent:#9cbfa8; --accent-ink:#17201b;
    --accent-soft:#2f3e36; --accent-soft-ink:#cfe0d4;
    --red:#e09a8c; --gold:#c8b08a;
    --cover-from:#2c3a33; --cover-to:#3a3328; --cover-ink:#d6e2d6; --cover-chip:#1b1f1dd9;
    --shadow:0 4px 18px #0006; --focus:#e0a860;
  }
}
:root[data-theme="dark"] {
  --bg:#1b1f1d; --surface:#232926; --surface-2:#2b322e;
  --ink:#e6e0d2; --muted:#b4ab98; --line:#3c4540;
  --accent:#9cbfa8; --accent-ink:#17201b;
  --accent-soft:#2f3e36; --accent-soft-ink:#cfe0d4;
  --red:#e09a8c; --gold:#c8b08a;
  --cover-from:#2c3a33; --cover-to:#3a3328; --cover-ink:#d6e2d6; --cover-chip:#1b1f1dd9;
  --shadow:0 4px 18px #0006; --focus:#e0a860;
}

/* =========================================================
   二、基本排版（字級加大、行距加寬，適合長時間閱讀）
   ========================================================= */
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: "PingFang TC", "Microsoft JhengHei", "Noto Sans TC", "Heiti TC", sans-serif;
  font-size: 17px;
  line-height: 1.8;
  letter-spacing: .02em;
  transition: background-color .2s, color .2s;
}
h1, h2, h3, .logo, .serif {
  font-family: "Noto Serif TC", "Songti TC", "PMingLiU", serif;
  letter-spacing: .03em;
}
a { color: inherit; text-decoration: none; }
button, input, textarea, select { font: inherit; color: inherit; }
button { cursor: pointer; }
img { max-width: 100%; }

/* 鍵盤操作時清楚顯示目前位置 */
:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; border-radius: 6px; }

.skip { position: absolute; left: -9999px; }
.skip:focus { left: 12px; top: 12px; z-index: 99; background: var(--surface); padding: 8px 14px; }

/* =========================================================
   三、頁首導覽列
   ========================================================= */
header {
  position: sticky; top: 0; z-index: 10;
  background: var(--surface);
  border-bottom: 1px solid var(--line);
}
.bar {
  max-width: 1160px; margin: 0 auto;
  padding: 10px 20px;
  display: flex; align-items: center; gap: 20px;
}
.logo { font-size: 24px; font-weight: 900; white-space: nowrap; display: flex; align-items: center; }
.seal {
  display: inline-grid; place-items: center;
  width: 30px; height: 30px; margin-right: 10px;
  background: var(--red); color: #fff;
  border-radius: 5px; font-size: 15px;
}
.nav { display: flex; gap: 4px; }
.nav a, .tool-btn {
  padding: 8px 14px; border-radius: 8px;
  font-size: 16px; white-space: nowrap;
  border: 1px solid transparent; background: none;
}
.nav a:hover { background: var(--surface-2); }
.nav a[aria-current="page"] { background: var(--accent); color: var(--accent-ink); }
.actions { margin-left: auto; display: flex; gap: 6px; }
.tool-btn { border-color: var(--line); }
.tool-btn:hover { background: var(--surface-2); }
.tool-btn[aria-current="page"] { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }

/* =========================================================
   四、主要內容區
   ========================================================= */
main { max-width: 1120px; margin: 0 auto; padding: 32px 22px 40px; min-height: 60vh; }

.hero {
  position: relative; overflow: hidden;
  padding: 38px 40px;
  background: linear-gradient(110deg, var(--surface), var(--surface-2));
  border: 1px solid var(--line); border-radius: 14px;
}
.hero::after {
  content: "山 · 水 · 杏 林";
  position: absolute; right: 26px; bottom: 6px;
  font-family: "Noto Serif TC", serif; font-size: 46px;
  color: var(--gold); opacity: .13; letter-spacing: 12px;
  pointer-events: none;
}
.eyebrow { font-size: 14px; color: var(--accent); letter-spacing: 3px; font-weight: 600; }
.hero h1 { font-size: clamp(28px, 4.2vw, 42px); line-height: 1.4; margin: 8px 0 10px; }
.hero h1 em { color: var(--red); font-style: normal; }
.hero p { margin: 4px 0; color: var(--muted); }

.stats { display: flex; gap: 12px; margin-top: 22px; flex-wrap: wrap; }
.stat {
  min-width: 118px; padding: 10px 18px; text-align: center;
  background: var(--surface); border: 1px solid var(--line); border-radius: 10px;
}
.stat strong { display: block; font-size: 28px; line-height: 1.3; color: var(--red); }
.stat span { font-size: 14px; color: var(--muted); }

h2.section {
  font-size: 24px; margin: 44px 0 18px;
  padding-bottom: 10px; border-bottom: 1px solid var(--line);
  display: flex; align-items: baseline; flex-wrap: wrap; gap: 4px 14px;
}
h2.section small { font-family: inherit; font-size: 14px; font-weight: normal; color: var(--muted); letter-spacing: 0; }

/* 科目卡片 */
.cards { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 18px; }
.course {
  display: flex; min-height: 210px;
  background: var(--surface); border: 1px solid var(--line); border-radius: 12px;
  overflow: hidden; box-shadow: var(--shadow);
  transition: transform .15s, box-shadow .15s;
}
.course:hover { transform: translateY(-2px); }
.cover {
  width: 34%; flex: none; position: relative;
  display: grid; place-items: center; padding: 12px; text-align: center;
  background: linear-gradient(145deg, var(--cover-from), var(--cover-to));
  color: var(--cover-ink);
}
.cover::before { content: "☯"; position: absolute; font-size: 78px; opacity: .25; }
.cover span {
  position: relative; font-family: "Noto Serif TC", serif;
  font-size: 21px; font-weight: 900; padding: 8px 12px;
  background: var(--cover-chip); border: 1px solid var(--line); border-radius: 4px;
}
.course-body { flex: 1; min-width: 0; padding: 18px 20px; display: flex; flex-direction: column; }
.course h3 { font-size: 21px; margin: 0 0 10px; line-height: 1.45; }
.numbers { display: flex; gap: 26px; padding: 8px 0; border-block: 1px solid var(--line); }
.numbers > div { white-space: nowrap; }
.numbers strong { font-size: 22px; color: var(--red); }
.numbers small { font-size: 14px; color: var(--muted); }
.meta-label { font-size: 14px; color: var(--muted); margin: 10px 0 0; }
.course .latest { margin-bottom: 12px; }
.course .go { margin-top: auto; }

.link {
  background: none; border: 0; padding: 4px 0;
  color: var(--accent); font-weight: 700; text-align: left;
}
.link:hover { text-decoration: underline; text-underline-offset: 4px; }

/* 更新清單、面板 */
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; overflow: hidden; }
.update {
  display: grid; grid-template-columns: 110px 150px 1fr; gap: 12px;
  padding: 14px 20px; border-bottom: 1px solid var(--line); font-size: 16px;
}
.update:last-child { border-bottom: 0; }
.update time { color: var(--muted); font-variant-numeric: tabular-nums; }
.tag {
  display: inline-block; padding: 2px 12px; border-radius: 999px;
  background: var(--accent-soft); color: var(--accent-soft-ink); font-size: 14px;
}
.prose { padding: 20px 24px; }
.prose p { margin: 8px 0; }
.prose b { color: var(--accent); }

/* 搜尋列 */
.toolbar { display: flex; gap: 10px; flex-wrap: wrap; margin: 18px 0 22px; }
.toolbar input { flex: 1 1 240px; max-width: 360px; }
.toolbar select { flex: 0 1 220px; }
input, textarea, select {
  width: 100%; padding: 10px 12px;
  background: var(--surface); color: var(--ink);
  border: 1px solid var(--line); border-radius: 8px;
}
input:focus, textarea:focus, select:focus { border-color: var(--accent); }

/* 圖卡格子 */
.itemgrid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 18px; }
.item {
  display: flex; flex-direction: column;
  background: var(--surface); border: 1px solid var(--line); border-radius: 12px; overflow: hidden;
}
.thumb {
  height: 170px; display: grid; place-items: center;
  background: linear-gradient(125deg, var(--cover-from), var(--cover-to));
  color: var(--cover-ink); font-size: 38px; opacity: .95;
}
.thumb { position: relative; overflow: hidden; }
.thumb img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
.item-body { padding: 16px 18px; display: flex; flex-direction: column; flex: 1; }
.item-body .kicker { font-size: 14px; color: var(--red); }
.item h3 { margin: 2px 0 6px; font-size: 19px; line-height: 1.5; }
.item p { margin: 0 0 12px; font-size: 15px; color: var(--muted); }
.item .link { margin-top: auto; }

/* 詳細內容（長文閱讀：限制行寬） */
.reading { max-width: 760px; margin: 0 auto; }
.reading h1 { font-size: clamp(26px, 3.6vw, 34px); line-height: 1.45; margin: 6px 0 4px; }
.reading .date { color: var(--muted); font-size: 15px; margin: 0 0 14px; }
.reading .content { white-space: pre-wrap; font-size: 18px; line-height: 1.95; }
.detail-image { display: block; max-height: 460px; margin: 14px auto; border-radius: 10px; }

/* 按鈕 */
.btn {
  display: inline-block; padding: 9px 18px; border-radius: 8px;
  background: var(--accent); color: var(--accent-ink); border: 1px solid var(--accent);
}
.btn:hover { filter: brightness(1.08); }
.btn.secondary { background: transparent; color: var(--ink); border-color: var(--line); }
.btn.secondary:hover { background: var(--surface-2); }
.btn.danger:hover { border-color: var(--red); color: var(--red); }
.back { margin-bottom: 18px; }
.back + h2.section { margin-top: 4px; }

/* 管理後台 */
.notice {
  margin: 16px 0; padding: 12px 18px; font-size: 15px;
  background: var(--surface); border-left: 4px solid var(--gold); border-radius: 6px;
}
.admin-tabs { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 16px; }
.adminlist { display: grid; gap: 8px; margin-top: 16px; }
.adminrow {
  display: flex; align-items: center; justify-content: space-between; gap: 12px;
  padding: 10px 14px; background: var(--surface);
  border: 1px solid var(--line); border-radius: 8px;
}
.adminrow small { color: var(--muted); font-size: 14px; }
.adminrow .row-actions { display: flex; gap: 6px; flex: none; }
.field { margin: 14px 0; }
.field label { display: block; margin-bottom: 4px; font-size: 15px; color: var(--muted); }
.field textarea { min-height: 120px; line-height: 1.7; }

.empty { color: var(--muted); padding: 22px; }

/* 訊息框、登入框 */
.msg { margin: 12px 0; padding: 10px 14px; border-radius: 8px; font-size: 15px; border: 1px solid var(--line); background: var(--surface); }
.msg.error { color: var(--red); border-color: var(--red); }
.msg.ok { color: var(--accent); border-color: var(--accent); }
.login-box { max-width: 420px; margin: 8px auto; }
.login-box h2 { margin-top: 0; }
.admin-bar { display: flex; align-items: center; justify-content: space-between; gap: 10px 16px; flex-wrap: wrap; margin-bottom: 14px; }
.admin-bar .who { color: var(--muted); font-size: 15px; }
.check { display: flex; align-items: center; gap: 8px; font-size: 15px; }
.check input { width: auto; }
button:disabled { opacity: .6; cursor: progress; }

footer {
  max-width: 1120px; margin: 0 auto; padding: 22px;
  border-top: 1px solid var(--line);
  color: var(--muted); font-size: 14px;
}

/* =========================================================
   五、響應式（平板、手機）
   ========================================================= */
@media (max-width: 960px) {
  .itemgrid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
}
@media (max-width: 720px) {
  body { font-size: 16px; }
  .bar { flex-wrap: wrap; gap: 8px 12px; padding: 10px 16px; }
  .logo { font-size: 21px; }
  .actions { margin-left: auto; }
  /* 手機上導覽列改成可左右滑動的一排 */
  .nav { order: 3; width: 100%; overflow-x: auto; scrollbar-width: none; margin: 0 -4px; padding-bottom: 2px; }
  .nav::-webkit-scrollbar { display: none; }
  .nav a { padding: 6px 12px; font-size: 15px; }
  .tool-btn { padding: 6px 10px; font-size: 14px; }
  .tool-btn .label { display: none; }   /* 手機只顯示圖示 */
  main { padding: 22px 16px 32px; }
  .hero { padding: 26px 20px; }
  .hero::after { display: none; }
  .cards, .itemgrid { grid-template-columns: 1fr; }
  .course { min-height: 0; }
  .cover { width: 30%; }
  .cover::before { font-size: 56px; }
  .cover span { font-size: 17px; padding: 6px 8px; }
  .course-body { padding: 14px 16px; }
  .course h3 { font-size: 19px; }
  .numbers { gap: 14px; flex-wrap: wrap; }
  .numbers small { font-size: 13px; }
  .update { grid-template-columns: auto 1fr; padding: 12px 16px; }
  .update .desc { grid-column: 1 / -1; }
  .stat { min-width: 0; flex: 1; padding: 8px 10px; }
  .adminrow { flex-wrap: wrap; }
  .reading .content { font-size: 17px; }
  footer { padding: 18px 16px; }
}

/* 使用者若設定「減少動態效果」，就關閉動畫 */
@media (prefers-reduced-motion: reduce) {
  * { transition: none !important; scroll-behavior: auto !important; }
  .course:hover { transform: none; }
}
</style>
</head>

<body>
<a class="skip" href="#app">跳到主要內容</a>

<header>
  <div class="bar">
    <a class="logo" href="#home"><span class="seal">醫</span>中醫學堂</a>
    <nav class="nav" aria-label="主要導覽">
      <a href="#home" data-nav="home">首頁</a>
      <a href="#courses" data-nav="courses">課程總覽</a>
      <a href="#projects" data-nav="projects">活動專案</a>
      <a href="#about" data-nav="about">關於我們</a>
    </nav>
    <div class="actions">
      <button class="tool-btn" id="theme" type="button"></button>
      <a class="tool-btn" href="#admin" data-nav="admin">⚙<span class="label"> 管理後台</span></a>
    </div>
  </div>
</header>

<main id="app" tabindex="-1"></main>

<footer>中醫學堂 · 課程圖卡總目錄　｜　學習用網站，請尊重教材著作權。</footer>

<script>
/* =========================================================
   一、資料來源：Cloudflare D1 雲端資料庫（透過 /api/content 讀取）
   ========================================================= */
let data = { courses: [], items: [], projects: [] };
let loadState = 'loading';   // loading 載入中 | ready 完成 | error 失敗
let loadError = '';
let admin = null;            // 目前登入的管理員；null＝未登入
let adminChecked = false;    // 是否已向伺服器確認過登入狀態
let adminFlash = '';         // 管理後台的提示訊息（例如「已儲存」）

// 呼叫後端 API 的共用函式：自動處理 JSON 與錯誤訊息
async function api(path, options = {}) {
  const opts = { method: 'GET', credentials: 'same-origin', ...options, headers: {} };
  if (options.body !== undefined) {
    opts.headers['Content-Type'] = 'application/json';
    opts.body = JSON.stringify(options.body);
  }
  let res;
  try {
    res = await fetch(path, opts);
  } catch {
    throw Object.assign(new Error('網路連線失敗，請檢查網路後再試一次。'), { status: 0 });
  }
  let body = null;
  try { body = await res.json(); } catch {}
  if (!res.ok) {
    throw Object.assign(new Error(body?.error || `伺服器錯誤（${res.status}）`), { status: res.status });
  }
  return body;
}

// 把伺服器的錯誤轉成看得懂的中文
function friendly(err) {
  if (err.status === 401) return '登入已過期，請重新登入。';
  if (err.status === 403) return '你的帳號沒有這項權限。';
  if (err.status === 413) return '資料太大，請改用較小的圖片。';
  if (err.status >= 500 && !/[一-鿿]/.test(err.message)) return '伺服器暫時無法處理，請稍後再試。';
  return err.message;
}

async function loadContent() {
  try {
    data = await api('/api/content');
    loadState = 'ready';
  } catch (err) {
    loadState = 'error';
    loadError = friendly(err);
  }
  render();
}

async function checkLogin() {
  try {
    admin = (await api('/api/me')).admin;
  } catch {
    admin = null;
  }
  adminChecked = true;
}

/* 小工具 */
const esc = s => String(s ?? '').replace(/[&<>"']/g, c =>
  ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const cut = (s, n) => { s = String(s ?? ''); return s.length > n ? s.slice(0, n) + '…' : s; };
const getCourse = id => data.courses.find(c => c.id == id);
const courseName = id => getCourse(id)?.title || '未分類';
const byDateDesc = (a, b) => String(b.date || '').localeCompare(String(a.date || ''));

/* =========================================================
   三、頁面狀態與網址（網址會跟著頁面改變，可用「上一頁」）
   #home  #courses  #items/科目編號  #projects  #about  #admin
   #detail/item/編號  #detail/project/編號
   ========================================================= */
const PAGES = ['home', 'courses', 'items', 'projects', 'detail', 'about', 'admin'];
let page = 'home', filter = 'all', query = '', adminType = 'items', detailTarget = ['item', 0];
const app = document.getElementById('app');

function readHash() {
  const parts = decodeURIComponent(location.hash.slice(1)).split('/');
  page = PAGES.includes(parts[0]) ? parts[0] : 'home';
  if (page === 'items') filter = parts[1] || 'all';
  if (page === 'detail') detailTarget = [parts[1] === 'project' ? 'project' : 'item', parts[2]];
}

/* =========================================================
   四、各頁面內容
   ========================================================= */
function courseCard(c, compact) {
  return `
  <article class="course">
    <div class="cover" aria-hidden="true"><span>${esc(c.icon || c.title.slice(0, 2))}</span></div>
    <div class="course-body">
      <h3>${esc(c.title)}</h3>
      ${compact
        ? `<p class="meta-label">${c.lessons} 堂課 · ${c.cards} 張圖卡</p>`
        : `<div class="numbers">
             <div><strong>${c.lessons}</strong><small> 堂　收錄課堂</small></div>
             <div><strong>${c.cards}</strong><small> 張　圖卡數量</small></div>
           </div>`}
      <p class="meta-label">最新一堂</p>
      <div class="latest">${esc(c.latest) || '—'}</div>
      <a class="link go" href="#items/${c.id}">進入圖卡目錄 →</a>
    </div>
  </article>`;
}

function itemCard(i, type) {
  const kicker = type === 'item' ? courseName(i.courseId) : '活動專案';
  return `
  <article class="item">
    <div class="thumb">${i.image ? `<img src="${esc(i.image)}" alt="${esc(i.title)}" loading="lazy">` : '<span aria-hidden="true">☯</span>'}</div>

/* =========================================================
   五、管理後台（登入後才能編輯，資料直接存進雲端資料庫）
   ========================================================= */
const TYPE_NAME = { courses: '課程', items: '圖卡', projects: '活動專案' };
const ROLE_NAME = { owner: '擁有者', admin: '管理員', editor: '編輯者', viewer: '檢視者' };

function loginHtml() {
  return `
  <div class="panel prose login-box">
    <h2>管理員登入</h2>
    <form id="loginform">
      <div class="field"><label for="l-email">Email</label><input id="l-email" name="email" type="email" autocomplete="username" required></div>
      <div class="field"><label for="l-pw">密碼</label><input id="l-pw" name="password" type="password" autocomplete="current-password" required></div>
      <div id="loginmsg"></div>
      <button class="btn" type="submit">登入</button>
    </form>
  </div>`;
}

function adminPage() {
  if (!adminChecked) return '<p class="empty">確認登入狀態中…</p>';
  if (!admin) return loginHtml();

  const rows = data[adminType] || [];
  const flash = adminFlash ? `<div class="msg ok">${esc(adminFlash)}</div>` : '';
  adminFlash = '';
  return `
  <div class="admin-bar">
    <h2 class="section" style="margin:0;border:0;padding:0">管理後台</h2>
    <div><span class="who">${esc(admin.displayName)}（${ROLE_NAME[admin.role] || admin.role}）</span>
      <button type="button" class="btn secondary" id="logout">登出</button></div>
  </div>
  <div class="notice">在這裡新增、修改或刪除的內容，會<b>立即儲存到雲端資料庫</b>，所有訪客都會看到。${admin.canDelete ? '' : '你的帳號可以新增與修改，但不能刪除。'}</div>
  ${flash}
  <div class="admin-tabs">
    ${Object.keys(TYPE_NAME).map(t => `<button type="button" class="btn ${adminType === t ? '' : 'secondary'}" data-admin-type="${t}" aria-pressed="${adminType === t}">${TYPE_NAME[t]}管理</button>`).join('')}
  </div>
  ${admin.canWrite ? `<button type="button" class="btn" id="add">＋ 新增${TYPE_NAME[adminType]}</button>` : '<p class="empty">你的帳號只能檢視。</p>'}
  <div class="adminlist">
    ${rows.map(i => `
      <div class="adminrow">
        <div><b>${esc(i.title)}</b><br><small>${adminType === 'courses' ? `${i.lessons} 堂 · ${i.cards} 張` : esc(i.date || '')}${adminType === 'items' ? ' · ' + esc(courseName(i.courseId)) : ''}</small></div>
        <div class="row-actions">
          ${admin.canWrite ? `<button type="button" class="btn secondary" data-edit="${i.id}">編輯</button>` : ''}
          ${admin.canDelete ? `<button type="button" class="btn secondary danger" data-delete="${i.id}">刪除</button>` : ''}
        </div>
      </div>`).join('') || '<p class="empty">尚無資料</p>'}
  </div>
  <div id="editor"></div>`;
}

function editorHtml(i) {
  i = i || {};
  const isCourse = adminType === 'courses';
  const courseFields = `
    <div class="field"><label for="f-icon">封面文字（最多 10 字）</label><input id="f-icon" name="icon" maxlength="10" value="${esc(i.icon || '')}"></div>
    <div class="field"><label for="f-lessons">課堂數</label><input id="f-lessons" name="lessons" type="number" min="0" value="${i.lessons ?? 0}"></div>
    <div class="field"><label for="f-cards">圖卡數</label><input id="f-cards" name="cards" type="number" min="0" value="${i.cards ?? 0}"></div>
    <div class="field"><label for="f-latest">最新課程名稱</label><input id="f-latest" name="latest" maxlength="200" value="${esc(i.latest || '')}"></div>`;
  const entryFields = `
    ${adminType === 'items' ? `
    <div class="field"><label for="f-course">所屬科目</label>
      <select id="f-course" name="courseId">${data.courses.map(c => `<option value="${c.id}" ${i.courseId == c.id ? 'selected' : ''}>${esc(c.title)}</option>`).join('')}</select>
    </div>` : ''}
    <div class="field"><label for="f-date">日期</label><input id="f-date" name="date" type="date" value="${esc(i.date || new Date().toISOString().slice(0, 10))}"></div>
    <div class="field"><label for="f-desc">內容介紹</label><textarea id="f-desc" name="description">${esc(i.description || '')}</textarea></div>
    <div class="field"><label for="f-img">圖片（PNG、JPG、WebP、GIF；大張照片會自動壓縮）</label><input id="f-img" name="image" type="file" accept="image/png,image/jpeg,image/webp,image/gif"></div>
    ${i.image ? `<img src="${esc(i.image)}" alt="" style="max-height:120px;border-radius:6px">
    <label class="check"><input type="checkbox" name="removeImage"> 移除目前的圖片</label>
    <p class="meta-label">未重新上傳將保留原圖。</p>` : ''}`;
  return `
  <div class="panel prose" style="margin-top:20px">
    <h2>${i.id ? '編輯' : '新增'}${TYPE_NAME[adminType]}</h2>
    <form id="editform">
      <div class="field"><label for="f-title">標題</label><input id="f-title" name="title" required maxlength="200" value="${esc(i.title || '')}"></div>
      ${isCourse ? courseFields : entryFields}
      <div id="formmsg"></div>
      <button class="btn" type="submit">儲存資料</button>
      <button class="btn secondary" type="button" id="cancel">取消</button>
    </form>
  </div>`;
}

/* 圖片處理：大於 600 KB 或邊長超過 1600 像素的照片，自動縮小並轉成 JPG */
const MAX_IMAGE_BYTES = 600 * 1024;
const MAX_IMAGE_SIDE = 1600;

const readAsDataURL = blob => new Promise((resolve, reject) => {
  const r = new FileReader();
  r.onload = () => resolve(r.result);
  r.onerror = () => reject(new Error('讀取圖片失敗'));
  r.readAsDataURL(blob);
});

async function prepareImage(file) {
  if (!/^image\/(png|jpeg|webp|gif)$/.test(file.type)) {
    throw new Error('只支援 PNG、JPG、WebP、GIF 圖片。');
  }
  if (file.type === 'image/gif') { // 動圖無法壓縮，只檢查大小
    if (file.size > MAX_IMAGE_BYTES) throw new Error('GIF 動圖請小於 600 KB。');
    return readAsDataURL(file);
  }
  let bitmap;
  try { bitmap = await createImageBitmap(file); } catch { throw new Error('無法讀取這張圖片，請換一張試試。'); }
  const { width, height } = bitmap;
  if (file.size <= MAX_IMAGE_BYTES && Math.max(width, height) <= MAX_IMAGE_SIDE) {
    bitmap.close?.();
    return readAsDataURL(file);
  }
  let scale = Math.min(1, MAX_IMAGE_SIDE / Math.max(width, height));
  const canvas = document.createElement('canvas');
  const ctx = canvas.getContext('2d');
  for (let attempt = 0; attempt < 6; attempt++) {
    canvas.width = Math.max(1, Math.round(width * scale));
    canvas.height = Math.max(1, Math.round(height * scale));
    ctx.fillStyle = '#ffffff';               // 透明背景改成白色
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    ctx.drawImage(bitmap, 0, 0, canvas.width, canvas.height);
    for (const quality of [0.85, 0.75, 0.65]) {
      const blob = await new Promise(r => canvas.toBlob(r, 'image/jpeg', quality));
      if (blob && blob.size <= MAX_IMAGE_BYTES) { bitmap.close?.(); return readAsDataURL(blob); }
    }
    scale *= 0.75;
  }
  bitmap.close?.();
  throw new Error('圖片太大，無法壓縮到 600 KB 以內。');
}

// 儲存或刪除後：重新讀取最新資料並更新畫面
async function reloadAfterChange(message) {
  adminFlash = message;
  try {
    data = await api('/api/content');
    loadState = 'ready';
  } catch (err) {
    adminFlash = message + '（但重新載入失敗，請重新整理頁面）';
  }
  render();
}

// 處理錯誤：登入過期就回到登入畫面，其他錯誤顯示在指定位置
function handleError(err, box) {
  if (err.status === 401) {
    admin = null;
    render();
    const m = document.getElementById('loginmsg');
    if (m) m.innerHTML = `<div class="msg error">${esc(friendly(err))}</div>`;
    return;
  }
  if (box) box.innerHTML = `<div class="msg error">${esc(friendly(err))}</div>`;
  else alert(friendly(err));
}

function showEditor(i) {
  const box = document.getElementById('editor');
  box.innerHTML = editorHtml(i);
  box.scrollIntoView({ behavior: 'smooth', block: 'start' });
  document.getElementById('cancel').onclick = () => { box.innerHTML = ''; };

  const form = document.getElementById('editform');
  form.onsubmit = async e => {
    e.preventDefault();
    const btn = form.querySelector('[type=submit]');
    const msg = document.getElementById('formmsg');
    msg.innerHTML = '';
    btn.disabled = true;
    btn.textContent = '儲存中…';
    try {
      const body = {};
      for (const [k, v] of new FormData(form).entries()) {
        if (k !== 'image' && k !== 'removeImage') body[k] = v;
      }
      const file = form.elements.image?.files[0];
      if (file) {
        btn.textContent = '處理圖片中…';
        body.image = await prepareImage(file);
        btn.textContent = '儲存中…';
      } else if (form.elements.removeImage?.checked) {
        body.image = '';
      }
      if (i?.id) await api(`/api/admin/${adminType}/${i.id}`, { method: 'PUT', body });
      else await api(`/api/admin/${adminType}`, { method: 'POST', body });
      await reloadAfterChange(`已儲存「${body.title}」`);
    } catch (err) {
      btn.disabled = false;
      btn.textContent = '儲存資料';
      handleError(err, msg);
    }
  };
}

/* =========================================================
   六、畫面更新與按鈕綁定
   ========================================================= */
const VIEWS = { home: homePage, courses: coursesPage, items: itemsPage, projects: projectsPage, detail: detailPage, about: aboutPage, admin: adminPage };

function render() {
  if (loadState === 'loading') {
    app.innerHTML = '<p class="empty">資料載入中…</p>';
  } else if (loadState === 'error') {
    app.innerHTML = `<div class="msg error">無法載入資料：${esc(loadError)}</div><button type="button" class="btn" id="retry">重新載入</button>`;
  } else {
    app.innerHTML = VIEWS[page]();
  }
  // 導覽列目前位置
  const navKey = page === 'items' ? 'courses' : page === 'detail' ? (detailTarget[0] === 'project' ? 'projects' : 'courses') : page;
  document.querySelectorAll('[data-nav]').forEach(a => {
    if (a.dataset.nav === navKey) a.setAttribute('aria-current', 'page');
    else a.removeAttribute('aria-current');
  });
  bind();
}

function bind() {
  const retry = document.getElementById('retry');
  if (retry) retry.onclick = () => { loadState = 'loading'; render(); loadContent(); };

  // 搜尋：只更新圖卡區，不重畫整頁（輸入不會跳掉）
  const s = document.getElementById('search');
  if (s) s.oninput = () => { query = s.value; document.getElementById('itemgrid').innerHTML = itemGridHtml(); };

  const f = document.getElementById('coursefilter');
  if (f) f.onchange = () => { location.hash = 'items/' + f.value; };

  // 登入
  const lf = document.getElementById('loginform');
  if (lf) lf.onsubmit = async e => {
    e.preventDefault();
    const btn = lf.querySelector('[type=submit]');
    const msg = document.getElementById('loginmsg');
    btn.disabled = true;
    btn.textContent = '登入中…';
    msg.innerHTML = '';
    try {
      await api('/api/login', { method: 'POST', body: { email: lf.elements.email.value, password: lf.elements.password.value } });
      await checkLogin();
      if (!admin) throw new Error('登入沒有成功，請再試一次。');
      render();
    } catch (err) {
      btn.disabled = false;
      btn.textContent = '登入';
      msg.innerHTML = `<div class="msg error">${esc(err.status === 401 ? 'Email 或密碼錯誤。' : friendly(err))}</div>`;
    }
  };

  // 登出
  const lo = document.getElementById('logout');
  if (lo) lo.onclick = async () => {
    lo.disabled = true;
    try { await api('/api/logout', { method: 'POST' }); } catch {}
    admin = null;
    render();
  };

  document.querySelectorAll('[data-admin-type]').forEach(b => b.onclick = () => { adminType = b.dataset.adminType; render(); });

  const add = document.getElementById('add');
  if (add) add.onclick = () => showEditor(null);

  document.querySelectorAll('[data-edit]').forEach(b => b.onclick = () => {
    showEditor(data[adminType].find(x => x.id == b.dataset.edit));
  });

  document.querySelectorAll('[data-delete]').forEach(b => b.onclick = async () => {
    const id = Number(b.dataset.delete);
    if (adminType === 'courses' && data.items.some(x => x.courseId === id)) {
      alert('請先刪除或調整此課程所屬的圖卡。');
      return;
    }
    const row = data[adminType].find(x => x.id === id);
    if (!confirm(`確定刪除「${row?.title || ''}」？刪除後無法復原。`)) return;
    b.disabled = true;
    try {
      await api(`/api/admin/${adminType}/${id}`, { method: 'DELETE' });
      await reloadAfterChange(`已刪除「${row?.title || ''}」`);
    } catch (err) {
      b.disabled = false;
      handleError(err, null);
    }
  });
}

// 進入管理後台時，先向伺服器確認登入狀態
async function ensureAdminChecked() {
  if (page === 'admin' && !adminChecked) {
    await checkLogin();
    render();
  }
}

// 網址改變時切換頁面
window.addEventListener('hashchange', () => {
  const prev = page;
  readHash();
  if (page !== 'items') query = '';
  render();
  ensureAdminChecked();
  if (page !== prev || page === 'detail') window.scrollTo(0, 0);
});

/* =========================================================
   七、深色 / 淺色模式
   預設跟隨裝置設定；按下按鈕後會記住你的選擇
   ========================================================= */
const themeBtn = document.getElementById('theme');
const sysDark = window.matchMedia('(prefers-color-scheme: dark)');
const isDark = () => {
  const t = document.documentElement.dataset.theme;
  return t ? t === 'dark' : sysDark.matches;
};
function updateThemeButton() {
  const dark = isDark();
  themeBtn.innerHTML = dark ? '☀<span class="label"> 淺色模式</span>' : '☾<span class="label"> 深色模式</span>';
  themeBtn.setAttribute('aria-label', dark ? '切換為淺色模式' : '切換為深色模式');
}
themeBtn.onclick = () => {
  const next = isDark() ? 'light' : 'dark';
  document.documentElement.dataset.theme = next;
  try { localStorage.setItem('tcm-theme', next); localStorage.removeItem('tcm-dark'); } catch {}
  updateThemeButton();
};
sysDark.addEventListener?.('change', updateThemeButton);

/* 啟動 */
updateThemeButton();
readHash();
render();
loadContent();
ensureAdminChecked();
</script>

</html>
