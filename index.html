<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>中醫學堂｜課程圖卡總目錄</title><style>
:root{--paper:#f5eddd;--paper2:#fff9ee;--ink:#2d342e;--muted:#777461;--line:#d8c8ac;--green:#38584b;--red:#9b3e30;--gold:#977b51;--shadow:0 5px 22px #3d30201a}body.dark{--paper:#171e1d;--paper2:#25302c;--ink:#e9e3d6;--muted:#c2b9a5;--line:#49544b;--green:#a8c4ae;--red:#e8a093;--gold:#c8b28d;--shadow:0 5px 22px #0005}*{box-sizing:border-box}body{margin:0;color:var(--ink);background:var(--paper);font-family:'Noto Serif TC','PMingLiU',serif;line-height:1.65}body:before{content:'';position:fixed;inset:0;pointer-events:none;opacity:.2;background-image:radial-gradient(#9b876b 0.55px,transparent .55px);background-size:7px 7px}a{color:inherit;text-decoration:none}button,input,textarea,select{font:inherit}button{cursor:pointer}header{position:sticky;top:0;z-index:5;background:var(--paper2);border-bottom:1px solid var(--line)}.bar{max-width:1160px;margin:auto;padding:10px 20px;display:flex;align-items:center;gap:25px;flex-wrap:wrap}.logo{font-size:26px;font-weight:900;white-space:nowrap}.seal{display:inline-grid;place-items:center;background:var(--red);color:#fff;width:27px;height:27px;border-radius:4px;font-size:14px;margin-right:8px}.nav{display:flex;gap:8px;flex-wrap:wrap}.nav button,.actions button,.filters button{border:0;background:none;color:var(--ink);padding:9px 13px;border-radius:6px}.nav button.active,.nav button:hover,.filters button.active{background:var(--green);color:var(--paper2)}.actions{margin-left:auto;display:flex;gap:5px}.actions button{border:1px solid var(--line)}main{max-width:1120px;margin:auto;padding:28px 22px 70px;position:relative}.hero{position:relative;padding:35px 38px;border:1px solid var(--line);border-radius:12px;background:linear-gradient(110deg,var(--paper2),transparent);overflow:hidden}.hero:after{content:'山  ·  水  ·  杏  林';position:absolute;right:25px;bottom:8px;font-size:48px;color:var(--gold);opacity:.12;letter-spacing:12px;pointer-events:none}.eyebrow{font-size:13px;color:var(--green);letter-spacing:3px}.hero h1{font-size:clamp(27px,4vw,43px);line-height:1.35;margin:7px 0;color:var(--ink)}.hero h1 em{color:var(--red);font-style:normal}.hero p{margin:5px 0;color:var(--muted)}.stats{display:flex;gap:12px;margin-top:20px;flex-wrap:wrap}.stat{min-width:115px;border:1px solid var(--line);background:var(--paper2);border-radius:8px;padding:8px 16px;text-align:center}.stat strong{display:block;color:var(--red);font-size:25px;line-height:1.3}.stat span{font-size:12px;color:var(--muted)}h2{font-size:24px;margin:35px 0 16px;border-bottom:1px solid var(--line);padding-bottom:8px}h2 small{font-size:13px;color:var(--muted);font-weight:normal;margin-left:12px}.cards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:17px}.course{display:flex;min-height:215px;background:var(--paper2);border:1px solid var(--line);border-radius:10px;overflow:hidden;box-shadow:var(--shadow)}.cover{width:36%;flex:none;background:linear-gradient(145deg,#d2d9c4,#e8d7bb);color:#445c49;display:grid;place-items:center;text-align:center;padding:12px;position:relative}.cover:before{content:'☯';font-size:75px;opacity:.35;position:absolute}.cover span{position:relative;font-size:20px;font-weight:900;background:#f5edddcc;border:1px solid #c9bca6;padding:9px}.course-content{padding:17px;min-width:0;flex:1}.course h3{font-size:21px;margin:0 0 8px}.numbers{display:flex;border-block:1px solid var(--line);padding:8px 0;gap:22px}.numbers strong{color:var(--red);font-size:21px}.numbers small{font-size:12px;color:var(--muted)}.course p{font-size:13px;color:var(--muted);margin:10px 0 3px}.link{color:var(--green);font-weight:bold;background:none;border:0;padding:0;text-align:left}.updates,.panel{background:var(--paper2);border:1px solid var(--line);border-radius:10px;overflow:hidden}.update{padding:13px 18px;border-bottom:1px solid var(--line);display:grid;grid-template-columns:75px 125px 1fr;gap:10px;align-items:start;font-size:14px}.update:last-child{border:0}.tag{background:#dce7d8;color:#38584b;border-radius:20px;padding:3px 10px;font-size:12px;display:inline-block}.instructions{padding:18px 22px}.instructions p{margin:7px 0}.instructions b{color:var(--green)}footer{border-top:1px solid var(--line);padding:20px 0;color:var(--muted);font-size:12px;margin-top:40px}.toolbar{display:flex;gap:10px;flex-wrap:wrap;margin:18px 0}.toolbar input,.field input,.field textarea,.field select{width:100%;border:1px solid var(--line);background:var(--paper2);color:var(--ink);border-radius:7px;padding:10px}.toolbar input{max-width:300px}.filters{display:flex;gap:8px;flex-wrap:wrap}.itemgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}.item{border:1px solid var(--line);border-radius:9px;overflow:hidden;background:var(--paper2)}.thumb{height:160px;display:grid;place-items:center;background:linear-gradient(125deg,#d8dfd0,#f0e2c7);color:#40584c;font-size:35px}.thumb img{width:100%;height:100%;object-fit:cover}.item section{padding:15px}.item h3{margin:0}.item p{color:var(--muted);font-size:13px}.btn{background:var(--green);color:var(--paper2);border:0;border-radius:7px;padding:10px 16px}.btn.secondary{background:transparent;border:1px solid var(--line);color:var(--ink)}.field{margin:12px 0}.field label{display:block;margin-bottom:4px;font-size:13px;color:var(--muted)}.field textarea{min-height:90px}.adminlist{display:grid;gap:8px}.adminrow{display:flex;align-items:center;justify-content:space-between;gap:12px;border:1px solid var(--line);border-radius:7px;padding:10px}.adminrow small{color:var(--muted)}.adminrow button{margin-left:6px}.notice{border-left:3px solid var(--gold);padding:12px 16px;background:var(--paper2);margin:15px 0}.hidden{display:none!important}.back{margin-bottom:18px}.detail-image{max-width:100%;max-height:420px;border-radius:8px;display:block;margin:12px auto}.empty{color:var(--muted);padding:22px}.adminTabs{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:18px}@media(max-width:720px){.bar{gap:8px}.logo{font-size:21px}.actions{margin-left:0}.hero{padding:24px 19px}.cards,.itemgrid{grid-template-columns:1fr}.course{min-height:180px}.cover{width:32%}.course h3{font-size:18px}.update{grid-template-columns:65px 1fr}.update div:last-child{grid-column:1/-1}.stat{min-width:90px}.nav button{padding:7px}}
</style></head><body><header><div class="bar"><a class="logo" href="#home"><span class="seal">醫</span>中醫學堂</a><nav class="nav" id="nav"><button data-page="home">首頁</button><button data-page="courses">課程總覽</button><button data-page="projects">活動專案</button><button data-page="about">關於我們</button></nav><div class="actions"><button id="theme">◐ 護眼模式</button><button data-page="admin">⚙ 管理後台</button></div></div></header><main id="app"></main><script>
const defaults={courses:[{id:1,title:'組織學與胚胎學',lessons:2,cards:41,latest:'上皮（二）與結締組織（一）',icon:'組織'},{id:2,title:'醫學生物學',lessons:2,cards:37,latest:'染色體異常與染色體病',icon:'生物'},{id:3,title:'人體解剖學',lessons:3,cards:70,latest:'關節總論與軀幹骨的連結',icon:'解剖'},{id:4,title:'中醫基礎理論',lessons:2,cards:32,latest:'第一章 氣一元論、陰陽學說、五行學說',icon:'中基'}],items:[{id:101,courseId:4,title:'陰陽五行學說',description:'陰陽、五行、相生相剋的基本概念與學習重點。',image:'',date:'2026-10-25'},{id:102,courseId:2,title:'染色體異常與染色體病',description:'醫學生物學課程重點整理。',image:'',date:'2026-10-24'},{id:103,courseId:3,title:'關節總論與軀幹骨的連結',description:'人體解剖學圖卡與重點筆記。',image:'',date:'2026-10-21'}],projects:[{id:201,title:'中醫基礎理論複習計畫',description:'整理各章節圖卡與核心概念，建立循序複習架構。',image:'',date:'2026-10-25'}]};
let data;try{data=JSON.parse(localStorage.getItem('tcm-site-v1'))||structuredClone(defaults)}catch{data=structuredClone(defaults)};const save=()=>{try{localStorage.setItem('tcm-site-v1',JSON.stringify(data));return true}catch{alert('瀏覽器儲存空間不足，請改用較小的圖片。');return false}};const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));let page='home',filter='all',query='',adminType='items',editId=null;const app=document.getElementById('app');const getCourse=id=>data.courses.find(c=>c.id==id);const image=(it)=>it.image?`<img src="${esc(it.image)}" alt="${esc(it.title)}">`:'☯';function render(){document.querySelectorAll('[data-page]').forEach(b=>b.classList.toggle('active',b.dataset.page===page));let html='';if(page==='home'){let total=data.courses.reduce((s,c)=>s+c.cards,0),lessons=data.courses.reduce((s,c)=>s+c.lessons,0);html=`<div class="hero"><div class="eyebrow">學科複習考試速記圖卡</div><h1>福建台灣班 <em>26</em> 一上圖卡總目錄</h1><p>從經典出發，走向臨床實用 · 系統整理，圖文並茂</p><div class="stats"><div class="stat"><strong>${data.courses.length}</strong><span>收錄科目</span></div><div class="stat"><strong>${lessons}</strong><span>收錄課堂</span></div><div class="stat"><strong>${total}</strong><span>圖卡總數</span></div></div></div><h2>科目入口 <small>點擊進入該科目圖卡目錄</small></h2><div class="cards">${data.courses.map(c=>`<article class="course"><div class="cover"><span>${esc(c.icon||c.title.slice(0,2))}</span></div><div class="course-content"><h3>${esc(c.title)}</h3><div class="numbers"><div><strong>${c.lessons}</strong><small> 堂<br>收錄課堂</small></div><div><strong>${c.cards}</strong><small> 張<br>圖卡數量</small></div></div><p>最新一堂</p><div>${esc(c.latest)}</div><button class="link" data-open-course="${c.id}">進入圖卡目錄 ↗</button></div></article>`).join('')}</div><h2>更新說明 <small>依最新資料排序</small></h2><div class="updates">${[...data.items].sort((a,b)=>b.date.localeCompare(a.date)).slice(0,5).map(i=>`<div class="update"><div>${esc(i.date)}</div><div><span class="tag">${esc(getCourse(i.courseId)?.title||'其他')}</span></div><div><b>${esc(i.title)}</b>　${esc(i.description)}</div></div>`).join('')||'<div class="empty">目前沒有更新紀錄</div>'}</div><h2>使用說明</h2><div class="panel instructions"><p><b>瀏覽方式：</b>可依科目查看圖卡，點擊卡片進入詳細內容。</p><p><b>資料管理：</b>透過管理後台新增課程、圖卡與活動專案。</p><p><b>使用範圍：</b>本頁為學習用網站原型，請尊重教材著作權。</p></div>`}else if(page==='courses'){html=`<h2>課程總覽</h2><div class="cards">${data.courses.map(c=>`<article class="course"><div class="cover"><span>${esc(c.icon||c.title.slice(0,2))}</span></div><div class="course-content"><h3>${esc(c.title)}</h3><p>${c.lessons} 堂課 · ${c.cards} 張圖卡</p><p>${esc(c.latest)}</p><button class="btn" data-open-course="${c.id}">查看圖卡</button></div></article>`).join('')}</div>`}else if(page==='items'){let items=data.items.filter(i=>(filter==='all'||i.courseId==filter)&&(!query||[i.title,i.description,getCourse(i.courseId)?.title].join(' ').toLowerCase().includes(query.toLowerCase())));html=`<button class="btn secondary back" data-page="courses">← 返回課程</button><h2>圖卡目錄</h2><div class="toolbar"><input id="search" placeholder="搜尋圖卡或內容…" value="${esc(query)}"><select id="coursefilter" style="padding:9px;border:1px solid var(--line);background:var(--paper2);color:var(--ink);border-radius:7px"><option value="all">所有科目</option>${data.courses.map(c=>`<option value="${c.id}" ${filter==c.id?'selected':''}>${esc(c.title)}</option>`).join('')}</select></div><div class="itemgrid">${items.map(i=>itemCard(i,'item')).join('')||'<p class="empty">尚無符合條件的圖卡。</p>'}</div>`}else if(page==='projects'){html=`<h2>活動專案 <small>課程活動、讀書計畫與學習專案</small></h2><div class="itemgrid">${data.projects.map(i=>itemCard(i,'project')).join('')||'<p class="empty">尚無活動專案。</p>'}</div>`}else if(page==='detail'){const [type,id]=window.detailTarget||['item',0],i=(type==='item'?data.items:data.projects).find(x=>x.id==id);html=i?`<button class="btn secondary back" data-page="${type==='item'?'items':'projects'}">← 返回列表</button><article class="panel instructions"><div class="eyebrow">${type==='item'?esc(getCourse(i.courseId)?.title||'圖卡內容'):'活動專案'}</div><h1>${esc(i.title)}</h1><p>${esc(i.date)}</p>${i.image?`<img class="detail-image" src="${esc(i.image)}" alt="${esc(i.title)}">`:''}<div style="white-space:pre-wrap">${esc(i.description)}</div></article>`:'<p>找不到內容。</p>'}else if(page==='about'){html=`<div class="hero"><div class="eyebrow">傳承岐黃 · 學以致用</div><h1>關於中醫學堂</h1><p>這是一個整理中醫與醫學課程、圖卡筆記及學習專案的示範網站。</p><p>內容可由管理後台自行維護；正式公開前，請確認課程資料及圖片的使用授權。</p></div>`}else if(page==='admin'){html=adminHtml()}app.innerHTML=html+`<footer>中醫學堂 · 課程圖卡總目錄　｜　此版本為本機互動原型，資料僅儲存在此瀏覽器。</footer>`;bind()}
function itemCard(i,type){return `<article class="item"><div class="thumb">${image(i)}</div><section><small style="color:var(--red)">${type==='item'?esc(getCourse(i.courseId)?.title||'未分類'):'活動專案'}</small><h3>${esc(i.title)}</h3><p>${esc(i.description).slice(0,90)}</p><button class="link" data-detail="${type}:${i.id}">查看詳細內容 →</button></section></article>`}
function adminHtml(){let rows=data[adminType]||[];return `<h2>管理後台 <small>本機示範模式</small></h2><div class="notice"><b>重要：</b>這是無伺服器的功能原型，並非安全的正式後台。資料只保存在目前瀏覽器，無登入驗證、雲端同步或跨裝置共享；正式上線須串接 Cloudflare 後端及身分驗證。</div><div class="adminTabs"><button class="btn ${adminType==='courses'?'':'secondary'}" data-admin-type="courses">課程管理</button><button class="btn ${adminType==='items'?'':'secondary'}" data-admin-type="items">圖卡管理</button><button class="btn ${adminType==='projects'?'':'secondary'}" data-admin-type="projects">活動專案</button></div><button class="btn" id="add">＋ 新增${adminType==='courses'?'課程':adminType==='items'?'圖卡':'活動'}</button><div class="adminlist" style="margin-top:16px">${rows.map(i=>`<div class="adminrow"><div><b>${esc(i.title)}</b><br><small>${adminType==='courses'?`${i.lessons} 堂 · ${i.cards} 張`:(i.date||'')}</small></div><div><button class="btn secondary" data-edit="${i.id}">編輯</button><button class="btn secondary" data-delete="${i.id}">刪除</button></div></div>`).join('')||'<p>尚無資料</p>'}</div><div id="editor"></div>`}
function editorHtml(i={}){let course=adminType==='courses';return `<div class="panel instructions" style="margin-top:20px"><h2>${i.id?'編輯':'新增'}${course?'課程':adminType==='items'?'圖卡':'活動專案'}</h2><form id="editform"><div class="field"><label>標題</label><input name="title" required value="${esc(i.title||'')}"></div>${course?`<div class="field"><label>封面文字</label><input name="icon" value="${esc(i.icon||'')}"></div><div class="field"><label>課堂數</label><input name="lessons" type="number" min="0" value="${i.lessons??0}"></div><div class="field"><label>圖卡數</label><input name="cards" type="number" min="0" value="${i.cards??0}"></div><div class="field"><label>最新課程名稱</label><input name="latest" value="${esc(i.latest||'')}"></div>`:`${adminType==='items'?`<div class="field"><label>所屬科目</label><select name="courseId">${data.courses.map(c=>`<option value="${c.id}" ${i.courseId==c.id?'selected':''}>${esc(c.title)}</option>`).join('')}</select></div>`:''}<div class="field"><label>日期</label><input name="date" type="date" value="${esc(i.date||new Date().toISOString().slice(0,10))}"></div><div class="field"><label>內容介紹</label><textarea name="description">${esc(i.description||'')}</textarea></div><div class="field"><label>圖片上傳（建議小於 500 KB；僅存於此瀏覽器）</label><input name="image" type="file" accept="image/*"></div>${i.image?'<p>已設定圖片；未重新上傳將保留原圖。</p>':''}`}<button class="btn" type="submit">儲存資料</button> <button class="btn secondary" type="button" id="cancel">取消</button></form></div>`}
function bind(){document.querySelectorAll('[data-page]').forEach(b=>b.onclick=()=>{page=b.dataset.page;filter='all';query='';render();window.scrollTo(0,0)});document.querySelectorAll('[data-open-course]').forEach(b=>b.onclick=()=>{filter=b.dataset.openCourse;query='';page='items';render();window.scrollTo(0,0)});document.querySelectorAll('[data-detail]').forEach(b=>b.onclick=()=>{window.detailTarget=b.dataset.detail.split(':');page='detail';render();window.scrollTo(0,0)});let f=document.getElementById('coursefilter');if(f)f.onchange=()=>{filter=f.value;render()};let s=document.getElementById('search');if(s)s.oninput=()=>{query=s.value;const start=s.selectionStart;render();const n=document.getElementById('search');n.focus();n.setSelectionRange(start,start)};document.querySelectorAll('[data-admin-type]').forEach(b=>b.onclick=()=>{adminType=b.dataset.adminType;editId=null;render()});const showEditor=i=>{document.getElementById('editor').innerHTML=editorHtml(i);document.getElementById('cancel').onclick=()=>document.getElementById('editor').innerHTML='';document.getElementById('editform').onsubmit=async e=>{e.preventDefault();let form=e.currentTarget,fd=new FormData(form),obj=i?.id?{...i}:{id:Date.now()};for(let [k,v] of fd.entries()){if(k==='image')continue;obj[k]=['lessons','cards','courseId'].includes(k)?Number(v):v}const file=form.elements.image?.files[0];if(file){if(file.size>650000){alert('為避免超出瀏覽器儲存限制，請選擇小於 650 KB 的圖片。');return}obj.image=await new Promise((resolve,reject)=>{let r=new FileReader;r.onload=()=>resolve(r.result);r.onerror=reject;r.readAsDataURL(file)})}let arr=data[adminType];if(i?.id){arr[arr.findIndex(x=>x.id===i.id)]=obj}else arr.unshift(obj);if(save())render()}};let add=document.getElementById('add');if(add)add.onclick=()=>showEditor(null);document.querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>{let i=data[adminType].find(x=>x.id==b.dataset.edit);showEditor(i);document.getElementById('editor').scrollIntoView({behavior:'smooth'})});document.querySelectorAll('[data-delete]').forEach(b=>b.onclick=()=>{let id=Number(b.dataset.delete);if(adminType==='courses'&&data.items.some(x=>x.courseId===id)){alert('請先刪除或調整此課程所屬的圖卡。');return}if(confirm('確定刪除此筆資料？')){data[adminType]=data[adminType].filter(x=>x.id!==id);save();render()}})}document.getElementById('theme').onclick=()=>{document.body.classList.toggle('dark');localStorage.setItem('tcm-dark',document.body.classList.contains('dark')?'1':'0')};if(localStorage.getItem('tcm-dark')==='1')document.body.classList.add('dark');render();</script></body></html>
